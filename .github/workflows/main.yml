name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: RobotSim-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: RobotSim-windows-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: RobotSim-macos-arm64

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: RobotSim-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/RobotSim package/
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir package
          Copy-Item target/${{ matrix.target }}/release/RobotSim.exe package/
          Compress-Archive package/* ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
